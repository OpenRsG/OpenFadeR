[package]
name = "openfader"
version = "0.2.4"
edition = "2024"

[features]
default = ["app", "stems-gpu"]
app = ["stems", "dep:slint", "dep:openfader-ui", "dep:midir", "dep:wayland-client", "dep:wayland-backend", "dep:sys-locale"]
stems = ["dep:ort"]
# STEMS on the GPU (ONNX Runtime's WebGPU provider, Dawn). ONNX Runtime ships no WebGPU build for ARM Linux: the Raspberry
# Pi build (`--no-default-features --features app`, docs/raspberry-pi.md) separates on the CPU only.
stems-gpu = ["stems", "ort/webgpu"]

[[bin]]
name = "openfader"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "aiff", "pcm"] }
cpal = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.12"
# winit access: files dropped on the window (X11 / Windows / macOS) and the Wayland display for our own drag-and-drop (src/app/drop/).
slint = { version = "1.17", optional = true, features = ["unstable-winit-030", "raw-window-handle-06"] }
midir = { version = "0.11.1", optional = true }
ort = { version = "2.0.0-rc.14", optional = true, default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
libloading = "0.8" # Beat FX plugin libraries (src/plugin/effect.rs)
openfader-plugin = { path = "sdk", features = ["library"] } # the plugin ABIs (effects, track libraries) and the shared library types: one definition for host and plugins
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize", "send"] } # Lua plugins, run in-process (src/plugin/lua.rs)
openfader-ui = { path = "ui", optional = true } # the Slint UI, built as its own crate
sys-locale = { version = "0.3", optional = true } # the system's language for PREFS > VIEW > LANGUAGE = SYSTEM (src/app/i18n.rs); already in the tree through Slint

# Linux only: the mixer of the card we open (src/audio/device/mixer.rs, already in the tree through cpal), and drag-and-drop of
# files onto the window under Wayland, where winit 0.30 has none (src/app/drop/wayland.rs): a data device on winit's own connection.
# All of them are already in the tree through winit / cpal.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true, features = ["client_system"] }

[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }

[[example]]
name = "stems_bench"
required-features = ["stems"]

# Free space of a mount (statvfs), the macOS volume list (getfsstat) and the background priority of the analysis threads.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Removable drives (GetDriveTypeW...), ejecting them (DeviceIoControl), the analysis threads' priority and the job
# objects that end plugin processes with the app (src/plugin/process.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_Threading"] }

# The program icon in the .exe (build.rs, assets/openfader.rc).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Shipping build: cross-crate optimisation and no symbol table. Keep the everyday release build's symbols for backtraces,
# and avoid its LTO relink cost during iteration. Ship libwebgpu_dawn.so alongside either binary for GPU STEMS.
[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"

# Whole-crate optimisation for the app's own code in the shipped binary. Not for openfader-ui: its ~25 MB of generated
# Slint code in one codegen unit would make the dist build far slower for no measured gain. A package override resets the
# profile's `strip` (Cargo 1.99 then strips debug info only): it is repeated here.
[profile.dist.package.openfader]
codegen-units = 1
strip = "symbols"

# Raspberry Pi 3 / 4 / CM4 (aarch64, 1-4 GB): everything optimised together, no symbols, small and fast to load
# (docs/raspberry-pi.md, Dockerfile.pi). Unwinding stays: library plugins report panics as errors.
[profile.pi]
inherits = "dist"
lto = "fat"

[profile.pi.package.openfader]
codegen-units = 1
strip = "symbols"
