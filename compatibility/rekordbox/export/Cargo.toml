[package]
name = "compat-rekordbox-export"
version = "0.1.0"
edition = "2024"

[dependencies]
openfader-plugin.workspace = true
compat-rekordbox-common.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
chrono.workspace = true
# Cover thumbnails (80×80 and 240×240 JPEG, as rekordbox writes them); already in the app's build through Slint.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
