name: Promote verified 0.2.8 packages
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  promote:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Promote the successful matrix without recompilation
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          import pathlib
          import plistlib
          import shutil
          import subprocess
          import tarfile
          import zipfile

          source_run = '40907951215'
          source_sha = '71da28803ac82bf684f5162c8fb85868e4155f6f'
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/OpenRsG/OpenFadeR/actions/runs/{source_run}']))
          assert run['head_sha'] == source_sha and run['conclusion'] == 'success'
          names = ['package-linux', 'package-windows', 'package-macos', 'package-pi', 'package-pi4']
          command = ['gh', 'run', 'download', source_run, '--dir', 'original']
          for name in names:
              command += ['--name', name]
          subprocess.run(command, check=True)
          original = pathlib.Path('original')
          out = pathlib.Path('out')
          out.mkdir()

          old = 'openfader-0.2.8-dev-linux-x86_64'
          new = 'openfader-0.2.8-linux-x86_64'
          with tarfile.open(original / 'package-linux' / (old + '.tar.gz')) as source, tarfile.open(out / (new + '.tar.gz'), 'w:gz') as target:
              for member in source:
                  assert member.name == old or member.name.startswith(old + '/')
                  assert '..' not in pathlib.PurePosixPath(member.name).parts and not member.issym() and not member.islnk()
                  stream = source.extractfile(member) if member.isfile() else None
                  member.name = new + member.name[len(old):]
                  target.addfile(member, stream)

          old = 'openfader-0.2.8-dev-windows-x86_64'
          new = 'openfader-0.2.8-windows-x86_64'
          with zipfile.ZipFile(original / 'package-windows' / (old + '.zip')) as source, zipfile.ZipFile(out / (new + '.zip'), 'w') as target:
              for member in source.infolist():
                  assert member.filename.startswith(old + '/') and '..' not in pathlib.PurePosixPath(member.filename).parts
                  renamed = copy.copy(member)
                  renamed.filename = new + member.filename[len(old):]
                  with source.open(member) as reader, target.open(renamed, 'w') as writer:
                      shutil.copyfileobj(reader, writer)

          for variant in ('pi', 'pi4'):
              name = f'openfader-0.2.8-linux-aarch64-{variant}.tar.gz'
              shutil.copy2(original / f'package-{variant}' / name, out / name)

          subprocess.run(['ditto', '-x', '-k', str(original / 'package-macos/OpenFadeR-0.2.8-dev-macos-arm64.zip'), 'mac'], check=True)
          app = pathlib.Path('mac/OpenFadeR.app')
          executable = app / 'Contents/MacOS/openfader'
          shutil.copy2(executable, 'before-unsigned')
          subprocess.run(['codesign', '--remove-signature', 'before-unsigned'], check=True)
          plist_path = app / 'Contents/Info.plist'
          with plist_path.open('rb') as file:
              plist = plistlib.load(file)
          assert plist['CFBundleVersion'] == '0.2.8-dev' and plist['CFBundleShortVersionString'] == '0.2.8-dev'
          plist['CFBundleVersion'] = plist['CFBundleShortVersionString'] = '0.2.8'
          with plist_path.open('wb') as file:
              plistlib.dump(plist, file)
          subprocess.run(['codesign', '--force', '-s', '-', str(app)], check=True)
          subprocess.run(['codesign', '--verify', '--deep', '--strict', '--verbose=2', str(app)], check=True)
          assert subprocess.check_output(['lipo', '-archs', str(executable)], text=True).strip() == 'arm64'
          shutil.copy2(executable, 'after-unsigned')
          subprocess.run(['codesign', '--remove-signature', 'after-unsigned'], check=True)
          def digest(path):
              with open(path, 'rb') as file:
                  return hashlib.file_digest(file, 'sha256').hexdigest()
          assert digest('before-unsigned') == digest('after-unsigned'), 'Unsigned executable changed'
          subprocess.run(['ditto', '-c', '-k', '--keepParent', str(app), str(out / 'OpenFadeR-0.2.8-macos-arm64.zip')], check=True)
          expected = {'openfader-0.2.8-linux-x86_64.tar.gz', 'openfader-0.2.8-windows-x86_64.zip', 'OpenFadeR-0.2.8-macos-arm64.zip', 'openfader-0.2.8-linux-aarch64-pi.tar.gz', 'openfader-0.2.8-linux-aarch64-pi4.tar.gz'}
          assert {path.name for path in out.iterdir()} == expected
          print('Promoted all five packages from', source_sha, 'without compilation; macOS metadata/signature validated and unsigned executable unchanged.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: promoted-v0.2.8
          path: out/*
          compression-level: 0
