name: Release

# Tag v*: a draft release with the Linux, Windows, Apple silicon and Raspberry Pi archives, in the layout of
# docs/releases/README.md. Publish it with: gh release edit <tag> --draft=false --latest
# A push to main that changes Cargo.lock (every release commit does) and a manual run package the same archives without
# releasing. That proves them before the tag exists and leaves the dependency cache where tag builds can read it (a cache
# saved by a tag run is private to that tag). When the tagged commit was packaged that way, the tag builds nothing: its draft
# is made from those archives, a minute of work instead of half an hour. Otherwise the tag builds everything.
# macOS is two parallel jobs: a native Intel build that is smoke-tested, and the ARM cross-build with archive
# architecture/signature checks that ships. The draft needs both.
on:
  push:
    tags: ["v*"]
    # Path filters are not evaluated for tags: every v* tag still runs.
    branches: [main]
    paths: [Cargo.lock]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The companion tags this release bundles (Dockerfile.pi has its own copies of the same three).
  PLUGINS_REF: v0.2.12
  THEMES_REF: openfader-v0.2.9
  MAPPINGS_REF: openfader-v0.2.13

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - name: Version, release notes, reusable archives
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | sed -n 1p)
          reuse=
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $v in Cargo.toml"; exit 1; }
            [ -f "docs/releases/$v.md" ] || { echo "::error::docs/releases/$v.md is missing: write the release notes first (docs/releases/README.md)"; exit 1; }
            python3 .github/release_notes.py --check "docs/releases/$v.md"
            for run in $(gh run list --workflow release.yml --commit "$GITHUB_SHA" --branch main --status success --json databaseId --jq '.[].databaseId'); do
              have=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.expired | not) | .name | select(test("^package-(linux|windows|macos|pi|pi4)$"))] | unique | length')
              if [ "$have" = 5 ]; then reuse=$run; echo "Reusing the archives of run $run"; break; fi
            done
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, arch: x86_64 }
          - { name: windows, os: windows-latest, arch: x86_64 }
          - { name: macos-smoke, os: macos-15-intel }
          - {
              name: macos,
              os: macos-15-intel,
              arch: arm64,
              target: aarch64-apple-darwin,
            }
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ startsWith(matrix.name, 'macos') && 240 || 120 }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Companions (plugins, themes, mappings)
        run: |
          git clone --depth 1 --branch "$PLUGINS_REF" https://github.com/OpenRsG/OpenFadeR-Plugins.git extension/plugin
          git clone --depth 1 --branch "$THEMES_REF" https://github.com/OpenRsG/OpenFadeR-Themes.git extension/skin
          git clone --depth 1 --branch "$MAPPINGS_REF" https://github.com/OpenRsG/OpenFadeR-Map.git mappings
      - name: System libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libudev-dev pkg-config \
            xvfb imagemagick libxkbcommon-x11-0 libgl1 libegl1 libgl1-mesa-dri libxcursor1 libxi6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            extension/plugin
          key: release-${{ matrix.name }}
          # Only main saves (tag and branch caches are private to them, and the repository's 10 GiB fill up); a tag reads main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The generated UI crate is 5 minutes of a Linux build and 24 of a macOS one, and it changes only with a .slint file: the
      # compiler cache serves it (and every other workspace crate that did not change). Only main and manual runs write it.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Use the compiler cache
        env:
          MODE: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'READ_WRITE' || 'READ_ONLY' }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_RW_MODE=$MODE" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        if: matrix.name == 'macos-smoke'
        with:
          path: .local/onnxruntime-intel
          key: macos-ort-intel-${{ hashFiles('.github/macos-ort.sh') }}
      - name: Intel ONNX Runtime
        if: matrix.name == 'macos-smoke'
        run: bash .github/macos-ort.sh
      - uses: actions/cache/save@v4
        if: always() && matrix.name == 'macos-smoke' && hashFiles('.local/onnxruntime-intel/*.dylib') != ''
        with:
          path: .local/onnxruntime-intel
          key: macos-ort-intel-${{ hashFiles('.github/macos-ort.sh') }}
      - name: Version
        id: version
        run: echo "version=${{ needs.plan.outputs.version }}" >> "$GITHUB_OUTPUT"
      # The app links SQLCipher with its own OpenSSL (the rekordbox extensions): Git Bash's perl lacks modules, Strawberry Perl (on
      # the runners) has them.
      - name: OpenSSL build tools (Windows)
        if: matrix.name == 'windows'
        run: |
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"
      - name: Build the plugins
        if: matrix.name != 'macos'
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: extension/plugin/build.sh --quiet
      - name: Build the app
        if: matrix.name != 'macos'
        # macOS: cross-crate LTO drops the compiler runtime's `__isPlatformVersionAtLeast`, which ONNX Runtime's CoreML code needs at link time.
        env:
          CARGO_PROFILE_DIST_LTO: ${{ matrix.name == 'macos-smoke' && 'false' || 'thin' }}
        run: |
          if [ "${{ matrix.name }}" = macos-smoke ]; then
            cargo build --profile dist --timings --no-default-features --features app
          else
            cargo build --profile dist --timings
          fi
      - name: Native macOS smoke
        if: matrix.name == 'macos-smoke'
        run: |
          mkdir native-smoke
          cp target/dist/openfader native-smoke/
          cp -L target/dist/*.dylib native-smoke/
          python .github/bundle.py native-smoke
          bash .github/smoke.sh native-smoke/openfader smoke
      - name: Cross-build Apple silicon app and plugins
        if: matrix.name == 'macos'
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
          CARGO_PROFILE_DIST_LTO: "false"
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: "-C target-cpu=apple-m1"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          extension/plugin/build.sh --quiet
          cargo build --profile dist --timings
      - name: Package
        if: matrix.name != 'macos-smoke'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          case "${{ matrix.name }}" in
          linux)
            d=openfader-$VERSION-linux-x86_64
            mkdir "$d"
            cp target/dist/openfader "$d/"
            # Keep runtime families aligned with install.sh; plugins are bundled in their own folders.
            for runtime in target/dist/libonnxruntime*.so* target/dist/libwebgpu_dawn.so*; do
              [ -f "$runtime" ] || continue
              cp -L "$runtime" "$d/"
            done
            python .github/bundle.py "$d"
            cp LICENSE README.md "$d/"
            cp assets/icon.png "$d/openfader.png"
            tar czf "out/$d.tar.gz" "$d"
            ;;
          windows)
            d=openfader-$VERSION-windows-x86_64
            mkdir "$d"
            cp target/dist/openfader.exe "$d/"
            cp target/dist/*.dll "$d/"
            # The Visual C++ runtime next to the program: it starts on a machine that never installed the redistributable.
            for f in vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll msvcp140_atomic_wait.dll; do cp "/c/Windows/System32/$f" "$d/"; done
            python .github/bundle.py "$d"
            cp LICENSE README.md "$d/"
            7z a -tzip "out/$d.zip" "$d" > /dev/null
            ;;
          macos)
            d=OpenFadeR.app
            mkdir -p "$d/Contents/MacOS" "$d/Contents/Resources"
            cp target/aarch64-apple-darwin/dist/openfader "$d/Contents/MacOS/"
            cp -L target/aarch64-apple-darwin/dist/*.dylib "$d/Contents/MacOS/"
            python .github/bundle.py "$d/Contents/Resources"
            cp LICENSE README.md "$d/Contents/Resources/"
            cp assets/openfader.icns "$d/Contents/Resources/"
            cat > "$d/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OpenFadeR</string>
            <key>CFBundleDisplayName</key><string>OpenFadeR</string>
            <key>CFBundleIdentifier</key><string>org.openrsg.openfader</string>
            <key>CFBundleExecutable</key><string>openfader</string>
            <key>CFBundleIconFile</key><string>openfader</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.music</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>OpenFadeR records from an audio input when you use REC or the microphone.</string>
          </dict>
          </plist>
          EOF
            # Ad-hoc signature (no developer identity): Apple silicon wants every program signed at least this way.
            codesign --force --deep -s - "$d"
            ditto -c -k --keepParent "$d" "out/OpenFadeR-$VERSION-macos-arm64.zip"
            ;;
          esac
          ls -l out
      # Linux/Windows execute their unpacked packages; the ARM macOS bundle is checked here, the native Intel smoke is its own job.
      - name: Unpack the archive
        if: matrix.name != 'macos-smoke'
        run: |
          mkdir unpacked
          cd unpacked
          case "${{ matrix.name }}" in
          linux) tar xzf ../out/*.tar.gz ;;
          windows) 7z x -y ../out/*.zip > /dev/null ;;
          macos) ditto -x -k ../out/*.zip . ;;
          esac
          ls
      - name: Smoke test of the packaged app (Linux, under Xvfb)
        if: matrix.name == 'linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" bash .github/smoke.sh unpacked/openfader-*/openfader smoke
      - name: Smoke test of the packaged app
        if: matrix.name == 'windows'
        run: bash .github/smoke.sh unpacked/openfader-*/openfader.exe smoke
      - name: Validate Apple silicon package
        if: matrix.name == 'macos'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          bundle = Path("unpacked/OpenFadeR.app")
          binary = bundle / "Contents/MacOS/openfader"
          assert binary.is_file()
          for path in [binary, *bundle.rglob("*.dylib")]:
              arches = subprocess.check_output(["lipo", "-archs", str(path)], text=True).split()
              assert "arm64" in arches, f"{path}: expected arm64, got {arches}"
          PY
          codesign --verify --deep --strict unpacked/OpenFadeR.app
      # Upload only after the platform smoke test or, for cross-built macOS, archive validation.
      - name: Upload validated package
        if: matrix.name != 'macos-smoke'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-smoke-${{ matrix.name }}
          path: smoke/
          if-no-files-found: ignore
      # Where the time went, per crate: open it in a browser.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.name }}
          path: target/cargo-timings/cargo-timing.html
          retention-days: 14
          if-no-files-found: ignore

  # Both archives keep whole-program LTO; Pi4/CM4 also uses Cortex-A72 code generation.
  pi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: pi, cpu: cortex-a53 }
          - { variant: pi4, cpu: cortex-a72 }
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Allow fat LTO to page on the hosted runner
        run: |
          sudo fallocate -l 16G "$RUNNER_TEMP/openfader-pi.swap"
          sudo chmod 600 "$RUNNER_TEMP/openfader-pi.swap"
          sudo mkswap "$RUNNER_TEMP/openfader-pi.swap"
          sudo swapon "$RUNNER_TEMP/openfader-pi.swap"
      - name: Build the Pi archive
        run: docker buildx build -f Dockerfile.pi --build-arg PI_VARIANT=${{ matrix.variant }} --build-arg TARGET_CPU=${{ matrix.cpu }} --build-arg OPENFADER_COMMIT=${GITHUB_SHA::9} -o dist/pi .
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Inspect and run the ARM archive
        run: |
          d="openfader-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)-linux-aarch64-${{ matrix.variant }}"
          readelf_dir="$RUNNER_TEMP/pi-elf"
          mkdir -p "$readelf_dir" pi-smoke
          tar -xzf "dist/pi/$d.tar.gz" -C "$readelf_dir"
          readelf -h "$readelf_dir/$d/openfader" | grep -q 'Machine:.*AArch64'
          if readelf -S "$readelf_dir/$d/openfader" | grep -q '\.symtab'; then
            echo "Pi executable unexpectedly retains its symbol table" >&2
            exit 1
          fi
          docker run --rm --platform linux/arm64 --cpus=4 --memory=2g --memory-swap=2g \
            -e QEMU_CPU=${{ matrix.cpu }} -e SLINT_BACKEND=winit-software \
            -e OPENFADER_MIDI_PORT=none-release-smoke \
            -v "$readelf_dir:/bundle:ro" -v "$PWD/.github:/checks:ro" -v "$PWD/pi-smoke:/smoke" \
            debian:trixie-slim bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends libasound2t64 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libudev1 libstdc++6 libgomp1 libx11-6 libxcursor1 libxi6 libxrandr2 fonts-dejavu-core python3 xvfb xauth imagemagick
              printf "pcm.null { type null }\npcm.!default { type null }\n" > /tmp/alsa.conf
              export ALSA_CONFIG_PATH=/tmp/alsa.conf
              xvfb-run -a -s "-screen 0 1600x1000x24" bash /checks/smoke.sh /bundle/'"$d"'/openfader /smoke
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-smoke-${{ matrix.variant }}
          path: pi-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.variant }}
          path: dist/pi/cargo-timing-*.html
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.variant }}
          path: dist/pi/*.tar.gz
          if-no-files-found: error

  release:
    needs: [plan, package, pi]
    # The builds are skipped when the archives are reused.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse == ''
        with:
          pattern: package-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse != ''
        with:
          run-id: ${{ needs.plan.outputs.reuse }}
          github-token: ${{ github.token }}
          pattern: package-*
          path: out
          merge-multiple: true
      # Refuses a missing archive or release notes that break the format; the smoke artifacts that came with the download
      # (app.log, screenshot.png) are not archives and not release assets.
      - name: Release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 .github/release_notes.py "$VERSION" out "docs/releases/$VERSION.md" --repo "$GITHUB_REPOSITORY" --plugins "$PLUGINS_REF" --themes "$THEMES_REF" --mappings "$MAPPINGS_REF" > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          name: OpenFadeR ${{ needs.plan.outputs.version }}
          draft: true
          files: |
            out/*.zip
            out/*.tar.gz
          body_path: release-body.md
          generate_release_notes: true
