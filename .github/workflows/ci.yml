name: CI

# Build, test and run the app on Linux, Windows and macOS (arm64), with the companion repositories checked out in place:
# the plugins are built and tested, then the built app is started with a private home, left running, screenshotted and closed
# (.github/smoke.sh). The screenshot and the app's output are uploaded. Built-in compatibility adapters live in
# compatibility/: `--workspace` tests them, and the `readers` job checks their exports with independent readers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      plugins_ref:
        description: Branch or tag of OpenFadeR-Plugins to build against
        default: v0.2.12

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Sources, themes and test data are read as LF text: no CRLF conversion on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Companions (plugins, themes, mappings)
        run: |
          git clone --depth 1 --branch "${{ inputs.plugins_ref || 'v0.2.12' }}" https://github.com/OpenRsG/OpenFadeR-Plugins.git extension/plugin
          git clone --depth 1 --branch openfader-v0.2.9 https://github.com/OpenRsG/OpenFadeR-Themes.git extension/skin
          git clone --depth 1 --branch openfader-v0.2.9 https://github.com/OpenRsG/OpenFadeR-Map.git mappings
      - name: System libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libudev-dev pkg-config \
            xvfb imagemagick libxkbcommon-x11-0 libgl1 libegl1 libgl1-mesa-dri libxcursor1 libxi6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Linux installer packaging
        if: matrix.name == 'linux'
        run: python .github/test_install.py -v
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            extension/plugin
          key: ${{ matrix.name }}
          cache-on-failure: true
      - uses: actions/cache/restore@v4
        if: matrix.name == 'macos'
        with:
          path: .local/onnxruntime-intel
          key: macos-ort-intel-${{ hashFiles('.github/macos-ort.sh') }}
      - name: Intel ONNX Runtime
        if: matrix.name == 'macos'
        run: bash .github/macos-ort.sh
      - uses: actions/cache/save@v4
        if: always() && matrix.name == 'macos' && hashFiles('.local/onnxruntime-intel/*.dylib') != ''
        with:
          path: .local/onnxruntime-intel
          key: macos-ort-intel-${{ hashFiles('.github/macos-ort.sh') }}
      # The app links SQLCipher with its own OpenSSL (the rekordbox extensions): Git Bash's perl lacks modules, Strawberry Perl (on
      # the runners) has them.
      - name: OpenSSL build tools (Windows)
        if: matrix.name == 'windows'
        run: |
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"
      - name: Build the plugins
        run: extension/plugin/build.sh --quiet
      - name: Build the app
        run: |
          if [ "${{ matrix.name }}" = macos ]; then
            cargo build --release --no-default-features --features app
          else
            cargo build --release
          fi
      # Windows: one process per test. The binary's tests share one process on the other OSes; on Windows the headless-Slint tests
      # together crash it (STATUS_ACCESS_VIOLATION) although each passes alone; the cause is not found, the app itself is not affected
      # (the smoke test below runs it).
      - uses: taiki-e/install-action@nextest
        if: matrix.name == 'windows'
      - name: Tests
        run: |
          if [ "${{ matrix.name }}" = windows ]; then
            cargo nextest run --release --workspace --no-fail-fast
          elif [ "${{ matrix.name }}" = macos ]; then
            cargo test --release --workspace --no-default-features --features openfader/app
          else
            cargo test --release --workspace
          fi
      - name: Plugin tests
        run: cargo test --release --no-fail-fast --manifest-path extension/plugin/Cargo.toml
      - name: Smoke test (Linux, under Xvfb)
        if: matrix.name == 'linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" bash .github/smoke.sh target/release/openfader smoke
      - name: Smoke test
        if: matrix.name != 'linux'
        run: bash .github/smoke.sh target/release/openfader smoke
      - name: Start-up time with 50 000 tracks (Linux, under Xvfb; the window must show within 5 s)
        if: matrix.name == 'linux'
        run: |
          cargo build --release --example big_library
          SMOKE_TRACKS=50000 SMOKE_GEN=target/release/examples/big_library \
            xvfb-run -a -s "-screen 0 1600x1000x24" bash .github/smoke.sh target/release/openfader smoke-startup 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: |
            smoke/
            smoke-startup/
          if-no-files-found: ignore

  # Other programs' readers (pyrekordbox, and rekordcrate for export.pdb) read a small stick the rekordbox extension wrote and must
  # find in it what was put on it: titles, track and cue counts, playlists. Any difference fails the job.
  readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: readers
      - run: pip install pyrekordbox==0.5.0
      - name: Write the fixture stick
        run: cargo run --release -p compat-rekordbox-export --example fixture -- "$RUNNER_TEMP/fixture"
      # A second, independent reader of export.pdb; the job goes on without it when it does not install.
      - name: Install rekordcrate
        id: rekordcrate
        continue-on-error: true
        run: cargo install rekordcrate --version 0.3.0 --locked
      - name: Read the stick with the other readers
        run: |
          args=()
          if [ "${{ steps.rekordcrate.outcome }}" = success ]; then args=(--rekordcrate rekordcrate); fi
          python .github/check_stick.py "$RUNNER_TEMP/fixture" "${args[@]}"
